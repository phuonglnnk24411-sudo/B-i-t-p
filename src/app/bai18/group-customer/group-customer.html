<table border="1">
  <tr>
    <th>Id</th>
    <th>Name</th>
    <th>Email</th>
    <th>Age</th>
    <th>#</th>
  </tr>

  <ng-container *ngFor="let group of customerGroups">
    <tr>
      <td colspan="5" style="font-weight: bold">
        {{ group.CustomerTypeId }} - {{ group.CustomterTypeName }}
      </td>
    </tr>

    <tr *ngFor="let cus of group.Customers">
      <td>{{ cus.Id }}</td>
      <td>{{ cus.Name }}</td>
      <td>{{ cus.Email }}</td>
      <td>{{ cus.Age }}</td>
      <td>
        <img [src]="cus.Image" [alt]="cus.Name" width="100" />
      </td>
    </tr>
  </ng-container>
</table>
