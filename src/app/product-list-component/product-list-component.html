<p>hello</p>
<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Image</th>
        </tr>
    </thead>
    <tbody>
       @for (p of products; track $index) {
        @if (p.price < 0) {
            <tr class="negative-price">
                <td>{{p.id}}</td>
                <td>{{p.name}}</td>
                <td>{{p.price}}</td>
                <td><img [src]="p.image" [alt]="p.name" width="100" height="100"></td>
            </tr>
        }
        @else {
            <tr>
                <td>{{p.id}}</td>
                <td>{{p.name}}</td>
                <td>{{p.price}}</td>
                <td><img [src]="p.image" [alt]="p.name" width="100" height="100"></td>
            </tr>
        }
        }
        @empty {
            <tr>
                <td colspan="4">Not Found Product!!!</td>
            </tr>
        }
    </tbody>
</table>
